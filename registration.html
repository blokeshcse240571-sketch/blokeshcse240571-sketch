<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examination Registration Form</title>
    <link rel="stylesheet" href="registration.css">
</head>
<body>

<div class="container">
    <h2>Examination Registration Form</h2>

    <form id="registrationForm">

        <div class="form-group">
            <label>First Name</label>
            <input type="text" id="firstName" required>
        </div>

        <div class="form-group">
            <label>Last Name</label>
            <input type="text" id="lastName" required>
        </div>

        <div class="form-group">
            <label>Father's Name</label>
            <input type="text" id="fatherName" required>
        </div>

        <div class="form-group">
            <label>Mother's Name</label>
            <input type="text" id="motherName" required>
        </div>

        <div class="form-group">
            <label>Date of Birth</label>
            <input type="date" id="dob" required>
        </div>

        <div class="form-group">
            <label>Gender</label>
            <select id="gender" required>
                <option value="">Select Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>
        </div>

        <div class="form-group">
            <label>Highest Educational Qualification</label>
            <select id="education" required>
                <option value="">Select Qualification</option>
                <option>10th</option>
                <option>Intermediate</option>
                <option>UG Degree</option>
                <option>PG Degree</option>
                <option>Ph.D</option>
            </select>
        </div>

        <div class="form-group">
            <label>Upload Passport Size Photo</label>
            <input type="file" id="photo" accept="image/*" required>
        </div>

        <div class="form-group">
            <label>Upload Signature</label>
            <input type="file" id="signature" accept="image/*" required>
        </div>

        <div class="buttons">
            <button type="submit">Submit</button>
            <button type="reset">Start Over</button>
        </div>

    </form>
</div>

<script src="registration.js"></script>
</body>
</html>
